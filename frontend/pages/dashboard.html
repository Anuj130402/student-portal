<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Student Portal</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <div class="topbar">
    <strong>Crux</strong>
    <div>
      <span id="userEmail" style="color:var(--muted); margin-right:1rem;"></span>
      <a href="settings.html" style="color:var(--accent); margin-right:1rem; text-decoration:none;">Settings</a>
      <a href="profile.html" style="color:var(--accent); margin-right:1rem; text-decoration:none;">Profile</a>
      <button onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="app">
    <h1>Summarize a document</h1>
    <p class="subtitle">Paste URLs or attach PDFs, choose a mode, and generate.</p>

    <label for="urls">Website URLs (one per line)</label>
    <textarea id="urls" rows="3" placeholder="https://en.wikipedia.org/wiki/Git"></textarea>
    <small id="urlCount" style="color:var(--muted);"></small>

    <label for="pdfs">PDF files</label>
    <input type="file" id="pdfs" accept="application/pdf" multiple />

    <label for="mode">Summary mode</label>
    <select id="mode">
      <option value="short">Short Summary</option>
      <option value="analytical">Analytical</option>
      <option value="recall">Data-Specific &amp; Easy-to-Remember</option>
    </select>

    <button id="generateBtn">Generate Summary</button>
    <p class="error" id="error"></p>

    <div id="result" class="result hidden">
      <div class="result-head">
        <span id="resultMode" class="badge"></span>
        button id="exportBtn" style="width:auto; margin:0 .5rem 0 0; padding:.4rem .9rem; font-size:.85rem;" class="secondary" disabled>Export .txt</button>
        <button id="saveBtn" style="width:auto; margin:0; padding:.4rem .9rem; font-size:.85rem;" disabled>Save to profile</button>
      </div>
      <div id="summary" class="summary"></div>
      <p class="subtitle" id="saveStatus" style="margin-top:.75rem;"></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-init.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/pdf-utils.js"></script>
  <script src="../js/saved-summaries.js"></script>
  <script src="../js/export.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
