<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Student Portal</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <div class="topbar">
    <strong>Crux</strong>
    <div>
      <span id="userEmail" style="color:var(--muted); margin-right:1rem;"></span>
      <a href="dashboard.html" style="color:var(--accent); margin-right:1rem; text-decoration:none;">Dashboard</a>

  <script src="../js/firebase-init.js"></script>
