<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Student Portal</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="card">
    <h1>Settings</h1>
    <p class="subtitle">Your summarizer preferences.</p>

    <label for="defaultMode">Default summary mode</label>
    <select id="defaultMode">
      <option value="short">Short Summary</option>
      <option value="analytical">Analytical</option>
      <option value="recall">Data-Specific &amp; Easy-to-Remember</option>
    </select>

    <label for="maxSources">Max sources per summary (1–10)</label>
    <input type="number" id="maxSources" min="1" max="10" value="5" />

    <button id="saveBtn">Save Preferences</button>
    <p class="error" id="status"></p>

    <button class="secondary" onclick="window.location.href='dashboard.html'">
      Back to Dashboard
    </button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-init.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
